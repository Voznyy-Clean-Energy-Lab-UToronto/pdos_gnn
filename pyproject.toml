[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pdos-gnn"
version = "1.0.0"
description = "ProDosNet: a graph neural network for predicting orbital-projected density of states and generating electronic fingerprints of inorganic materials"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Ihor Neporozhnii" }
]
keywords = [
    "materials-discovery",
    "graph-neural-networks",
    "density-of-states",
    "electronic-structure",
    "machine-learning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Lower bounds reflect the versions the published results were produced with.
# For the exact pinned environment, see requirements-lock.txt.
dependencies = [
    "torch>=1.13.1",
    "torch_geometric>=2.5.3",
    "torch_scatter>=2.1.2",
    "pymatgen>=2024.4.13",
    "numpy>=1.26.4,<2",
    "pandas>=2.2.2",
    "scipy>=1.13.1",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.5",
    "adjustText>=1.3.0",
    "tqdm>=4.66.1",
]

[project.optional-dependencies]
# Extra packages used only by the Jupyter notebooks (data download from the
# Materials Project, MD/diffusivity analysis).
notebooks = [
    "jupyter",
    "mp-api>=0.41.2",
    "emmet-core>=0.83.8",
    "kinisi>=1.1.1",
    "ase",
]

[project.urls]
Repository = "https://github.com/ineporozhnii/pdos_gnn"
Demo = "https://huggingface.co/spaces/inep/prodosmate"

[tool.setuptools.packages.find]
include = ["pdos_gnn*"]
exclude = ["data*", "notebooks*", "assets*", "scripts*", "_archive*"]

# Atomic feature tables are read at runtime by utilities/preprocess.py and the
# pretrained checkpoint is referenced by the README's predict example, so both
# must ship with the package (not just be present in a source checkout).
[tool.setuptools.package-data]
pdos_gnn = ["features/*.json", "pretrained/*.pth.tar"]
